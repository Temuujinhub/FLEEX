# Upstream definitions shared between the HTTP and TLS server blocks.
# Lives in its own file so enable-tls.sh can swap fleex.conf without
# losing the upstream definitions that fleex-tls.conf also needs.
upstream fleex_api {
    server api:3000;
    keepalive 32;
}

upstream fleex_web {
    server web:80;
    keepalive 16;
}
