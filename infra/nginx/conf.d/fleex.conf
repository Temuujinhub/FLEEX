# Fleex public site (HTTP). Serves the SPA, proxies /api and /ws.
# TLS is provisioned by certbot via infra/deploy/enable-tls.sh once DNS
# for fleex.mn points at this host. That script writes fleex-tls.conf
# alongside this file and reloads nginx.
#
# Upstream blocks live in upstreams.conf so fleex-tls.conf can reuse
# them when this file is disabled (during TLS rollout).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME http-01 challenge directory (mounted from host).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://fleex_api;
    }

    location /api/ {
        limit_req zone=api_zone burst=80 nodelay;
        proxy_pass http://fleex_api;
    }

    location /ws {
        proxy_pass http://fleex_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Camera-test rig (separate compose project `fleex-camtest`), which
    # publishes :8090 on the host. nginx reaches it via host.docker.internal,
    # resolved by the `extra_hosts: host-gateway` entry on the nginx service in
    # docker-compose.yml. The trailing slash strips the /camtest/ prefix.
    location /camtest/ {
        proxy_pass http://host.docker.internal:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://fleex_web;
        proxy_cache_bypass $http_upgrade;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    limit_conn conn_zone 50;
}
