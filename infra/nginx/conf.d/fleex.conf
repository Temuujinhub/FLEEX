# Fleex public site (HTTP). Serves the SPA, proxies /api and /ws.
# TLS is provisioned by certbot via infra/deploy/enable-tls.sh once DNS
# for fleex.mn points at this host. That script writes fleex-tls.conf
# alongside this file and reloads nginx.
#
# Upstream blocks live in upstreams.conf so fleex-tls.conf can reuse
# them when this file is disabled (during TLS rollout).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME http-01 challenge directory (mounted from host).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://fleex_api;
    }

    location /api/ {
        limit_req zone=api_zone burst=80 nodelay;
        proxy_pass http://fleex_api;
    }

    location /ws {
        proxy_pass http://fleex_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Camera-test rig (separate compose project `fleex-camtest`), which
    # publishes :8090 on the host. nginx reaches it via host.docker.internal,
    # resolved by the `extra_hosts: host-gateway` entry on the nginx service in
    # docker-compose.yml. The trailing slash strips the /camtest/ prefix.
    #
    # SECURITY: the rig has NO authentication — anyone who can reach this path
    # can read live GPS tracks, download captured camera footage, and trigger
    # on-demand photo/video capture. It is safe only while the rig is not
    # running on a production host. Before relying on this in production, put
    # it behind auth (nginx auth_basic or the app JWT) or remove this block.
    location /camtest/ {
        proxy_pass http://host.docker.internal:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://fleex_web;
        proxy_cache_bypass $http_upgrade;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP on the plaintext edge too (defense-in-depth against XSS before TLS
    # is enabled). Mirrors the policy in fleex-tls.conf.disabled: allows the
    # OSM/Esri/OpenTopo tile servers, the Google Maps JS SDK + tiles, blob:
    # web workers, and same-origin ws/wss for the live socket.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; img-src 'self' data: blob: https://images.unsplash.com https://*.tile.openstreetmap.org https://server.arcgisonline.com https://*.tile.opentopomap.org https://unpkg.com https://maps.googleapis.com https://maps.gstatic.com https://*.googleapis.com https://*.gstatic.com https://*.ggpht.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' wss: ws: https://*.tile.openstreetmap.org https://server.arcgisonline.com https://*.tile.opentopomap.org https://maps.googleapis.com https://*.googleapis.com https://*.gstatic.com; worker-src 'self' blob:; frame-ancestors 'self';" always;
    limit_conn conn_zone 50;
}
