<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fleex CamTest · NOMIN MOTOR</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --ok:#22c55e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:12px; padding:12px 18px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; font-weight:700; letter-spacing:.3px; }
  header .tag { font-size:11px; color:var(--muted); border:1px solid var(--line); padding:2px 8px; border-radius:999px; }
  header .spacer { flex:1; }
  header .status { font-size:12px; color:var(--muted); }
  header .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#64748b; margin-right:6px; vertical-align:middle; }
  header .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .wrap { display:flex; height:calc(100vh - 49px); }
  #map { flex:1; min-width:0; }
  .side { width:380px; max-width:42vw; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; }
  .side h2 { font-size:13px; margin:0; padding:12px 16px; border-bottom:1px solid var(--line); color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .meta { padding:10px 16px; border-bottom:1px solid var(--line); font-size:13px; }
  .meta div { display:flex; justify-content:space-between; padding:3px 0; }
  .meta .k { color:var(--muted); }
  .gallery { flex:1; overflow-y:auto; padding:12px; display:grid; grid-template-columns:1fr 1fr; gap:10px; align-content:start; }
  .card { background:var(--bg); border:1px solid var(--line); border-radius:8px; overflow:hidden; cursor:pointer; transition:border-color .15s; }
  .card:hover { border-color:var(--accent); }
  .card img { width:100%; height:110px; object-fit:cover; display:block; background:#000; }
  .card .cap { font-size:11px; color:var(--muted); padding:5px 7px; }
  .empty { color:var(--muted); font-size:13px; padding:24px 16px; text-align:center; grid-column:1 / -1; }
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.88); display:none; align-items:center; justify-content:center; z-index:1000; }
  #lightbox img { max-width:92vw; max-height:88vh; border-radius:6px; }
  #lightbox .close { position:absolute; top:18px; right:24px; color:#fff; font-size:30px; cursor:pointer; }
  #lightbox .cap { position:absolute; bottom:18px; color:#cbd5e1; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Fleex <span style="color:var(--accent)">CamTest</span></h1>
  <span class="tag">NOMIN MOTOR · туршилт</span>
  <div class="spacer"></div>
  <div class="status"><span class="dot" id="dot"></span><span id="status">холболт хүлээж байна…</span></div>
</header>

<div class="wrap">
  <div id="map"></div>
  <div class="side">
    <h2>Төхөөрөмж</h2>
    <div class="meta" id="meta">
      <div><span class="k">IMEI</span><span id="m-imei">—</span></div>
      <div><span class="k">Хурд</span><span id="m-speed">—</span></div>
      <div><span class="k">Сүүлийн байршил</span><span id="m-time">—</span></div>
      <div><span class="k">Цэгийн тоо</span><span id="m-points">—</span></div>
      <div><span class="k">Камер холболт</span><span id="m-cam">—</span></div>
      <div><span class="k">Зураг</span><span id="m-images">—</span></div>
    </div>
    <h2>Камерын зураг (DualCam)</h2>
    <div class="gallery" id="gallery"><div class="empty">Зураг ирээгүй байна.</div></div>
  </div>
</div>

<div id="lightbox"><span class="close">&times;</span><img id="lb-img" alt=""><div class="cap" id="lb-cap"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([47.918, 106.917], 12); // Ulaanbaatar
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap'
}).addTo(map);

let marker = null, track = null, fitted = false;
const fmtTime = ms => ms ? new Date(ms).toLocaleString('mn-MN') : '—';

async function refreshState() {
  try {
    const devices = await (await fetch('/api/state')).json();
    const dot = document.getElementById('dot'), status = document.getElementById('status');
    if (!devices.length) { status.textContent = 'Төхөөрөмж холбогдоогүй'; dot.className = 'dot'; return; }
    const d = devices.sort((a,b)=>b.online-a.online)[0];
    const online = Date.now() - d.online < 120000;
    dot.className = online ? 'dot on' : 'dot';
    status.textContent = online ? 'Холбогдсон' : 'Офлайн (' + fmtTime(d.online) + ')';
    document.getElementById('m-imei').textContent = d.imei;
    document.getElementById('m-speed').textContent = (d.last ? d.last.speed : 0) + ' км/ц';
    document.getElementById('m-time').textContent = d.last ? fmtTime(d.last.time) : '—';
    document.getElementById('m-points').textContent = (d.track || []).length;
    const camOn = d.camOnline && (Date.now() - d.camOnline < 180000);
    document.getElementById('m-cam').textContent = d.camOnline
      ? (camOn ? 'Холбогдсон' : 'Тасарсан') + ' · ' + Math.round((d.camBytes || 0) / 1024) + ' KB ирсэн'
      : 'Холболт алга';

    if (d.last && (d.last.lat || d.last.lng)) {
      const ll = [d.last.lat, d.last.lng];
      if (!marker) marker = L.marker(ll).addTo(map); else marker.setLatLng(ll);
      marker.bindPopup('IMEI ' + d.imei + '<br>' + d.last.speed + ' км/ц<br>' + fmtTime(d.last.time));
      const pts = (d.track || []).filter(p=>p.lat||p.lng).map(p=>[p.lat,p.lng]);
      if (track) track.remove();
      track = L.polyline(pts, { color:'#38bdf8', weight:3, opacity:.8 }).addTo(map);
      if (!fitted && pts.length) { map.fitBounds(track.getBounds().pad(0.2)); fitted = true; }
    }
  } catch (e) { /* keep polling */ }
}

async function refreshImages() {
  try {
    const imgs = await (await fetch('/api/images')).json();
    document.getElementById('m-images').textContent = imgs.length;
    const g = document.getElementById('gallery');
    if (!imgs.length) { g.innerHTML = '<div class="empty">Зураг ирээгүй байна.<br>(тохиргоо: 600с тутам эсвэл trigger-ээр)</div>'; return; }
    g.innerHTML = imgs.map(im => {
      const url = '/api/img/' + im.file;
      const cap = fmtTime(im.time) + ' · ' + Math.round(im.size/1024) + 'KB';
      return '<div class="card" data-url="'+url+'" data-cap="'+cap+'"><img loading="lazy" src="'+url+'"><div class="cap">'+cap+'</div></div>';
    }).join('');
    g.querySelectorAll('.card').forEach(c => c.onclick = () => openLightbox(c.dataset.url, c.dataset.cap));
  } catch (e) { /* keep polling */ }
}

function openLightbox(url, cap) {
  document.getElementById('lb-img').src = url;
  document.getElementById('lb-cap').textContent = cap;
  document.getElementById('lightbox').style.display = 'flex';
}
document.getElementById('lightbox').onclick = () => document.getElementById('lightbox').style.display = 'none';

refreshState(); refreshImages();
setInterval(refreshState, 4000);
setInterval(refreshImages, 5000);
</script>
</body>
</html>
