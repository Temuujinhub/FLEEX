# Isolated camera-test stack. Distinct project name / container / network /
# volume from production (fleex-*), distinct host ports (5028/5029/8090 vs the
# prod ingestor on 5027). Bring up:
#   docker compose -f docker-compose.cam.yml up -d --build
# Tear down completely (removes captured images too):
#   docker compose -f docker-compose.cam.yml down -v
name: fleex-camtest

services:
  camtest:
    build: .
    image: fleex/camtest:latest
    container_name: camtest
    restart: unless-stopped
    environment:
      CAMTEST_AVL_PORT: "5028"
      CAMTEST_CAM_PORT: "5029"
      CAMTEST_HTTP_PORT: "8090"
      CAMTEST_DATA_DIR: /app/data
    ports:
      - "5028:5028"   # FMC125 AVL telemetry (GPRS server)
      - "5029:5029"   # DualCam camera server
      - "8090:8090"   # demo web page
    volumes:
      - camtest-data:/app/data
    mem_limit: 256m

volumes:
  camtest-data:
