# Production-grade compose for Fleex GPS SaaS.
# Used both on the deploy host (178.128.27.70) and for local dev.
# Volumes are persistent; healthchecks gate dependent services.

services:
  postgres:
    image: timescale/timescaledb:2.16.1-pg15
    container_name: fleex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      # TimescaleDB auto-tuner. Defaults assume a 4 GB / 2 vCPU droplet
      # (DO s-2vcpu-4gb), which is the production minimum. Override in .env
      # for larger hosts (8 GB+).
      TS_TUNE_MEMORY: ${TS_TUNE_MEMORY:-1GB}
      TS_TUNE_NUM_CPUS: ${TS_TUNE_NUM_CPUS:-2}
      TS_TUNE_MAX_CONNS: ${TS_TUNE_MAX_CONNS:-100}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [fleex]
    # PostgreSQL tuning. Defaults below assume a 4 GB / 2 vCPU droplet
    # (production minimum). For larger hosts override in .env, e.g. 8 GB:
    #   PG_SHARED_BUFFERS=2GB
    #   PG_EFFECTIVE_CACHE_SIZE=6GB
    #   PG_WORK_MEM=32MB
    #   PG_MAINTENANCE_WORK_MEM=512MB
    #   PG_MAX_CONNECTIONS=200
    # NB: timescaledb-tune in the entrypoint writes shared_buffers,
    # work_mem, max_connections to postgresql.conf BEFORE postgres starts,
    # using TS_TUNE_MEMORY above. The -c overrides below take effect at
    # process start, but DURING `initdb`'s post-init phase the tuned config
    # is what gets used.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS:-512MB}"
      - "-c"
      - "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB}"
      - "-c"
      - "work_mem=${PG_WORK_MEM:-16MB}"
      - "-c"
      - "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}"
      - "-c"
      - "max_connections=${PG_MAX_CONNECTIONS:-100}"
      - "-c"
      - "max_worker_processes=${PG_MAX_WORKERS:-4}"
      - "-c"
      - "max_parallel_workers=${PG_MAX_PARALLEL_WORKERS:-2}"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "shared_preload_libraries=timescaledb"

  redis:
    image: redis:7.4-alpine
    container_name: fleex-redis
    restart: unless-stopped
    # maxmemory defaults to 512MB for a 4 GB droplet; override REDIS_MAXMEMORY
    # in .env (e.g. `REDIS_MAXMEMORY=2gb`) on larger production hosts.
    # volatile-lru (not allkeys-lru): only keys with a TTL are eligible for
    # eviction under memory pressure. The device-resolve / presence caches all
    # carry TTLs, while the command queues (fleex.commands:*) and events-engine
    # geofence transition state are TTL-less and must never be evicted —
    # allkeys-lru could silently drop a queued device command or a geofence
    # "inside" set, causing lost commands and phantom enter/exit events.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy volatile-lru
      --tcp-keepalive 60
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [fleex]

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    image: fleex/api:latest
    container_name: fleex-api
    restart: unless-stopped
    env_file: .env
    volumes:
      # Read-only access to the DualCam media blobs the media-service writes,
      # so the API can stream them after auth + tenant checks.
      - media-data:/data/media:ro
    environment:
      # connection_limit caps Prisma's pool. Without it Prisma defaults to
      # num_cpus*2+1, which on an 8-vCPU host is ~17 per API instance and,
      # multiplied across replicas, races the ingestor (16) + events-engine (8)
      # toward Postgres max_connections=100. A fixed 10 leaves headroom; front
      # Postgres with PgBouncer before scaling the API horizontally.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=10
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MEDIA_DATA_DIR: /data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      # First-boot needs to: run `prisma db push`, init the Nest container,
      # then synchronously run TimescaleInitService (hypertable, compression
      # policy, retention policy, continuous aggregate) — all of which gate
      # `app.listen()`. On a fresh DB this can take 90–120s before /health
      # accepts connections, so give it real headroom.
      start_period: 180s
    networks: [fleex]

  ingestor:
    build:
      context: ./services/gps-ingestor
      dockerfile: Dockerfile
    image: fleex/ingestor:latest
    container_name: fleex-ingestor
    restart: unless-stopped
    # Give the batcher time to drain its queue + flush the final COPY on
    # SIGTERM before Docker escalates to SIGKILL (default is only 10s). The
    # batcher's shutdown drain is bounded to ~10s + a 15s flush timeout.
    stop_grace_period: 30s
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Teltonika devices connect directly to this TCP port.
      - "5027:5027"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [fleex]

  # Events engine. Subscribes to `fleex.positions` on Redis, evaluates each
  # sample against the active geofences + device speed limits, and writes
  # Event rows (GEOFENCE_ENTER / GEOFENCE_EXIT / OVERSPEED) to Postgres while
  # republishing them on `fleex.events` for the API's WebSocket gateway.
  # Stateless beyond Redis-backed device transition state, so it scales
  # horizontally and tolerates restarts.
  events-engine:
    build:
      context: ./services/events-engine
      dockerfile: Dockerfile
    image: fleex/events-engine:latest
    container_name: fleex-events-engine
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        # Wait until prisma db push has materialised the schema; otherwise the
        # engine's INSERT against the events table fails on first boot.
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [fleex]

  # DualCam media service. Speaks the Teltonika DualCam file-transfer protocol
  # on :5029, persists captured photos/videos to the shared media-data volume
  # (+ metadata to Postgres), and consumes on-demand capture requests from
  # Redis (set by the API). Telemetry is unaffected — it still flows to the
  # gps-ingestor on :5027.
  media-service:
    build:
      context: ./services/media-service
      dockerfile: Dockerfile
    image: fleex/media-service:latest
    container_name: fleex-media-service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MEDIA_DATA_DIR: /data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        # Wait for `prisma db push` to materialise the device_images table.
        condition: service_healthy
    ports:
      - "5029:5029"   # Teltonika DualCam camera server
    volumes:
      - media-data:/data/media
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9092/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [fleex]

  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_WS_URL: /ws
        VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    image: fleex/web:latest
    container_name: fleex-web
    restart: unless-stopped
    depends_on:
      - api
    networks: [fleex]

  nginx:
    image: nginx:1.27-alpine
    container_name: fleex-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    # Hit the static /healthz route nginx serves itself (no upstream). If
    # nginx is up but config is broken, this will fail and the deploy
    # script's healthcheck loop will catch it instead of silently leaving
    # the site as 502.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [fleex]

volumes:
  postgres-data:
  redis-data:
  nginx-cache:
  media-data:

networks:
  fleex:
    driver: bridge
