# Production-grade compose for Fleex GPS SaaS.
# Used both on the deploy host (178.128.27.70) and for local dev.
# Volumes are persistent; healthchecks gate dependent services.

services:
  postgres:
    image: timescale/timescaledb:2.16.1-pg15
    container_name: fleex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      # TimescaleDB auto-tuner. Adjust via .env on bigger hosts.
      TS_TUNE_MEMORY: ${TS_TUNE_MEMORY:-1GB}
      TS_TUNE_NUM_CPUS: ${TS_TUNE_NUM_CPUS:-2}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [fleex]
    # PostgreSQL tuning. Defaults below assume a 2 GB droplet so a fresh
    # deploy works out of the box. For production, override in .env:
    #   PG_SHARED_BUFFERS=2GB
    #   PG_EFFECTIVE_CACHE_SIZE=6GB
    #   PG_WORK_MEM=32MB
    #   PG_MAINTENANCE_WORK_MEM=512MB
    #   PG_MAX_CONNECTIONS=200
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS:-256MB}"
      - "-c"
      - "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}"
      - "-c"
      - "work_mem=${PG_WORK_MEM:-8MB}"
      - "-c"
      - "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}"
      - "-c"
      - "max_connections=${PG_MAX_CONNECTIONS:-100}"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "shared_preload_libraries=timescaledb"

  redis:
    image: redis:7.4-alpine
    container_name: fleex-redis
    restart: unless-stopped
    # maxmemory defaults to 256MB for small hosts; override REDIS_MAXMEMORY in
    # .env (e.g. `REDIS_MAXMEMORY=2gb`) on production-sized droplets.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [fleex]

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    image: fleex/api:latest
    container_name: fleex-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [fleex]

  ingestor:
    build:
      context: ./services/gps-ingestor
      dockerfile: Dockerfile
    image: fleex/ingestor:latest
    container_name: fleex-ingestor
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Teltonika devices connect directly to this TCP port.
      - "5027:5027"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [fleex]

  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_WS_URL: /ws
        VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    image: fleex/web:latest
    container_name: fleex-web
    restart: unless-stopped
    depends_on:
      - api
    networks: [fleex]

  nginx:
    image: nginx:1.27-alpine
    container_name: fleex-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    networks: [fleex]

volumes:
  postgres-data:
  redis-data:
  nginx-cache:

networks:
  fleex:
    driver: bridge
