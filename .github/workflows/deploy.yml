# Fleex auto-deploy. On every push to main/claude branches, SSH into the
# DigitalOcean host (178.128.27.70) and run infra/deploy/deploy.sh, which
# performs a `git pull && docker compose up -d --build` with health gating
# and a rollback on failure.
#
# Required GitHub secrets:
#   DEPLOY_HOST          178.128.27.70
#   DEPLOY_USER          deploy (or root)
#   DEPLOY_SSH_KEY       OpenSSH private key with access to the host
#   DEPLOY_SSH_PORT      (optional, default 22)
#   DEPLOY_KNOWN_HOSTS   `ssh-keyscan -H 178.128.27.70` output (REQUIRED — the
#                        job fails without it; pins the host key against MITM)
#
# Branch policy:
#   - main                 → production deploy
#   - claude/saas-auto-* → production deploy (current development branch)
#   - other branches       → CI build only (no deploy)

name: deploy

on:
  push:
    branches:
      - main
      - 'claude/saas-auto-**'
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-check:
    name: Lint & build sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build, vet & test GPS ingestor
        working-directory: services/gps-ingestor
        run: |
          go mod download
          go vet ./...
          go build ./...
          go test ./...

      - name: Build, vet & test events engine
        working-directory: services/events-engine
        run: |
          go mod download
          go vet ./...
          go build ./...
          go test ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: API – install & build
        working-directory: services/api
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npx prisma generate
          npx nest build

      - name: Web – install & build
        working-directory: services/web
        env:
          VITE_API_URL: /api
          VITE_WS_URL: /ws
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run build

  deploy:
    name: Deploy to 178.128.27.70
    needs: build-check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key. Never fall back to ssh-keyscan/accept-new: a
          # MITM between the runner and the host could otherwise present its
          # own key and capture the deploy SSH session.
          if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_KNOWN_HOSTS secret is not set. Refusing to connect without a pinned host key." >&2
            echo "Generate it from a trusted network: ssh-keyscan -H -p <port> <host>" >&2
            exit 1
          fi
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Trigger remote deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_SSH_PORT:-22}"
          # `deploy` user is in the `docker` group and owns /opt/fleex, so no
          # sudo is needed for the build+up cycle. If you later add system-
          # level commands to deploy.sh, configure /etc/sudoers.d/fleex-deploy
          # and switch back to `sudo -n env ...`.
          #
          # ServerAlive* keeps the SSH session up while deploy.sh waits for
          # API cold-start healthchecks; without these the workflow died
          # with "client_loop: send disconnect: Broken pipe" after ~3 min.
          ssh -p "$PORT" \
              -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=40 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; cd /opt/fleex && env REF='$REF' SHA='$SHA' ./infra/deploy/deploy.sh"
